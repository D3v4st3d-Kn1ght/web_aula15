<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        window.onload = inicio;
        function inicio()
        {
            let enviar = document.getElementById('enviar');
            enviar.addEventListener('click', converter);
        }

        function converter()
        {
            let valor_reais = document.getElementById('valor_reais');
            let saida = document.getElementById('saida');
            let valor = parseFloat(valor_reais.value);

            const xhttp = new XMLHttpRequest();
            xhttp.onload = function()
            {
                saida.innerHTML = this.responseText; 
            }   

            xhttp.open("POST", "trade.php", true);

            xhttp.setRequestHeader("Content-type", "application/x-www-form-urlencoded");

            xhttp.send(`valor=${valor}`);
        }
    </script>
</head>
<body>
    <input type="text" id="valor_reais">
    <br>
    <button id="enviar">Enviar</button>
    <br>
    <div id="saida"></div>
</body>
</html>
